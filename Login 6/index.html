<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/Login 6/style.css">
    <title>Login 6</title>
</head>
<body>
    <section id="sessao">
        <div>
            <h1 class="titulo">Sign In With</h1>
        </div>
        <div id="icones">
            <button class="facebook">
                <a href="https://www.facebook.com/?locale=pt_BR">Facebook</a>
            </button>
            <button class="google">
                <a href="https://www.google.com.br/?hl=pt-BR">Google</a>
            </button>
        </div>
        <div>
            <div id="userpass">
                <div class="user">
                    <h4>Username</h4>
                </div>
                <div class="userin">
                    <input type="text">
                </div>
                <div class="pass">
                    <h4>Password</h4>
                </div>
                <div class="forgot">
                    <a href="">Forgot?</a>
                </div>
                <div class="passin">
                    <input type="password">
                </div>
            </div>
            <div class="botao">
                <button>
                    <a href="">Sign In</a>
                </button>
            </div>
            <div id="not a member">
                <h6>Not a member?</h6>
                <a href="">Sign up now</a>
            </div>
        </div>
    </section>
</body>
</html>
